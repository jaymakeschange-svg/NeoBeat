name: MidiJaQ v3 validated Windows release
on:
  push:
    branches: [ midijaq ]
    paths:
      - '.midijaq_release/patch.tar.xz'
      - '.github/workflows/midijaq-v3-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out MIDIJAQ's branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply MIDIJAQ-only source patch
        shell: pwsh
        run: |
          $hash = (Get-FileHash '.midijaq_release/patch.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '7e4e832b1a426c1e789260d96d5d99bebb9d1fda5c5a8d476b59c5ebfe64dcc1') { throw 'The transferred patch failed integrity verification' }
          python -c "import tarfile; tarfile.open(r'.midijaq_release/patch.tar.xz', 'r:xz').extractall(r'.midijaq_release')"
          $env:MIDIJAQ_CI_BUILD = '1'
          python .midijaq_release/apply_midijaq.py .
          if ($LASTEXITCODE -ne 0) { throw 'MIDIJAQ source patch failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'MIDIJAQ patch whitespace check failed' }

      - name: Configure JUCE on Windows
        run: cmake -B build -A x64

      - name: Build plugin, app and tests
        run: cmake --build build --config Release --parallel 4 --target MidiJaQ_VST3 MidiJaQ_Standalone test_jaq test_clock test_inst test_session test_evolving

      - name: Run MIDIJAQ tests in Release mode
        shell: pwsh
        run: |
          foreach ($test in @('test_jaq', 'test_clock', 'test_session', 'test_evolving')) {
            $file = Join-Path 'build/Release' ($test + '.exe')
            if (-not (Test-Path $file)) { throw "$test executable missing: $file" }
            & $file
            if ($LASTEXITCODE -ne 0) { throw "$test failed ($LASTEXITCODE)" }
          }
          $inst = Get-ChildItem build -Recurse -Filter test_inst.exe | Select-Object -First 1
          if (-not $inst) { throw 'test_inst.exe is missing' }
          & $inst.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Instrument playback test failed' }

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Validate MIDIJAQ VST3 with three strict pluginval seeds
        shell: pwsh
        timeout-minutes: 35
        run: |
          $vst = 'build/MidiJaQ_artefacts/Release/VST3/MidiJaQ.vst3'
          if (-not (Test-Path $vst)) { throw 'The compiled VST3 is missing' }
          New-Item -ItemType Directory -Force pluginval-log | Out-Null
          for ($i = 0; $i -lt 3; $i++) {
            $seed = '0x{0:x}' -f (Get-Random -Minimum 1 -Maximum 0x7fffffff)
            & ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --random-seed $seed --timeout-ms 600000 --output-dir pluginval-log $vst | Out-File ("pv_$i.txt")
            if ($LASTEXITCODE -ne 0) {
              Get-Content ("pv_$i.txt") -Tail 100
              throw "pluginval seed $seed failed"
            }
            Write-Host "pluginval seed $seed SUCCESS"
          }

      - name: Package verified Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse 'build/MidiJaQ_artefacts/Release/VST3/MidiJaQ.vst3' dist/
          Copy-Item 'build/MidiJaQ_artefacts/Release/Standalone/MidiJaQ.exe' dist/
          Copy-Item README.md dist/
          Copy-Item -Recurse pluginval-log dist/

      - name: Publish verified download
        uses: actions/upload-artifact@v4
        with:
          name: MidiJaQ-v3-Windows
          path: dist
          if-no-files-found: error

      - name: Commit validated MIDIJAQ source only
        shell: pwsh
        run: |
          $workflow = '.github/workflows/build.yml'
          $text = Get-Content $workflow -Raw
          $old = 'MidiJaQ_Standalone test_jaq test_clock'
          if (-not $text.Contains($old)) { throw 'Cannot update the main MIDIJAQ test targets safely' }
          $text = $text.Replace($old, 'MidiJaQ_Standalone test_jaq test_clock test_inst test_session test_evolving')
          $anchor = '      - name: Validate the VST3 with pluginval'
          if (-not $text.Contains($anchor)) { throw 'Cannot insert the new MIDIJAQ tests safely' }
          $extra = @(
            '      - name: Full session and evolving-generator tests'
            '        shell: pwsh'
            '        run: |'
            '          build\Release\test_session.exe'
            '          if ($LASTEXITCODE -ne 0) { throw "Session test failed" }'
            '          build\Release\test_evolving.exe'
            '          if ($LASTEXITCODE -ne 0) { throw "Evolving generator test failed" }'
            '          $inst = Get-ChildItem build -Recurse -Filter test_inst.exe | Select-Object -First 1'
            '          if (-not $inst) { throw "Missing instrument test" }'
            '          & $inst.FullName'
            '          if ($LASTEXITCODE -ne 0) { throw "Instrument test failed" }'
            ''
          ) -join "`n"
          $text = $text.Replace($anchor, $extra + $anchor)
          $text = $text.Replace('continue-on-error: true', 'continue-on-error: false')
          [System.IO.File]::WriteAllText((Resolve-Path $workflow).Path, $text)
          git rm -- '.midijaq_release/patch.tar.xz' '.github/workflows/midijaq-v3-release.yml'
          git add -- CMakeLists.txt Source/core/Jaq.h Source/core/Player.h Source/core/Session.h Source/app/Processor.h Source/app/Processor.cpp Source/app/Editor.cpp tools/HostTest.cpp tools/test_session.cpp tools/test_evolving.cpp .github/workflows/build.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Final changes failed diff checks; not pushing' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete MidiJaQ v3 chords, slots and evolving generators' -m 'Windows VST3, standalone, unit tests and pluginval passed before publication.'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit validated source' }
          git push origin HEAD:midijaq
          if ($LASTEXITCODE -ne 0) { throw 'Could not push validated source to midijaq' }
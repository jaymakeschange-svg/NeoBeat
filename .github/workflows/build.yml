name: Build NeoBeat (Windows)

on:
  push:
    branches: [ main, neobeat-2.0 ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build plugin, standalone and tools
        run: cmake --build build --config Release --parallel --target NeoBeat_VST3 NeoBeat_Standalone neobeat_cli test_sequencer test_workstation

      - name: Sequencer timing test
        run: build\Release\test_sequencer.exe

      - name: Workstation tests (Matrixxxer, grid, key map, modulation, threads)
        run: build\Release\test_workstation.exe

      - name: Render a preset with the Windows build (sanity check)
        run: build\Release\neobeat_cli.exe preset 0 build\swingbeat_classic_check.wav 2

      - name: Validate the VST3 with pluginval
        continue-on-error: true
        timeout-minutes: 40
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $vst = "build\NeoBeat_artefacts\Release\VST3\NeoBeat.vst3"
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 600000 --output-dir pluginval-log $vst | Tee-Object -FilePath pv.txt
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if (Test-Path pluginval-log) { Get-ChildItem pluginval-log -Recurse -File | ForEach-Object { Write-Host "==== $($_.FullName)"; Get-Content $_.FullName -Tail 120 } }
          if ($code -ne 0) {
            # run it again under the console debugger, which prints the call stack of a crash
            $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
            if ($cdb) {
              $seed = "0x25a66bb"
              $m = Select-String -Path pv.txt -Pattern "Random seed: (0x[0-9a-fA-F]+)" | Select-Object -First 1
              if ($m) { $seed = $m.Matches[0].Groups[1].Value }
              @(
                'sxe -c "r;kP 40;q" av',
                'sxe -c "r;kP 40;q" sov',
                'sxe -c "r;kP 40;q" c0000409',
                'sxe -c2 "kP 40;q" eh',
                'g'
              ) | Set-Content -Encoding ascii cdbcmds.txt
              New-Item -ItemType File -Force empty.txt | Out-Null
              Write-Host "==== pluginval under $($cdb.FullName), seed $seed"
              $p = Start-Process -FilePath $cdb.FullName -NoNewWindow -PassThru -RedirectStandardInput empty.txt -RedirectStandardOutput cdb.txt `
                     -ArgumentList "-G -lines -cf cdbcmds.txt .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --random-seed $seed --timeout-ms 600000 $vst"
              if (-not $p.WaitForExit(1500000)) { Stop-Process -Id $p.Id -Force }
              Get-Content cdb.txt -Tail 150
            } else { Write-Host "cdb.exe not found" }
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\NeoBeat_artefacts\Release\VST3\NeoBeat.vst3" dist\
          Copy-Item "build\NeoBeat_artefacts\Release\Standalone\NeoBeat.exe" dist\
          Copy-Item README.md dist\
          if (Test-Path pluginval-log) { Copy-Item -Recurse pluginval-log dist\ }

      - uses: actions/upload-artifact@v4
        with:
          name: NeoBeat-Windows
          path: dist

name: Build MidiJaQ (Windows)

on:
  push:
    branches: [ midijaq ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build the app, the plugin and the tests
        run: cmake --build build --config Release --parallel --target MidiJaQ_VST3 MidiJaQ_Standalone test_jaq test_clock test_inst test_session test_evolving test_orb test_room test_random test_audio test_chops test_map test_depth test_state test_endtoend

      - name: The plugin listened to (levels, the room, the Orb's effects, what the randomiser changes)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & ./build/test_audio_artefacts/Release/test_audio.exe
          if ($LASTEXITCODE -ne 0) { throw 'Audio test failed' }

      - name: What survives saving the project (the rooms, their samples, the map, the stage)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & ./build/test_state_artefacts/Release/test_state.exe
          if ($LASTEXITCODE -ne 0) { throw 'State round-trip failed' }

      - name: The Stereoroom listened to (per-chop placing, and depth as a ratio not a level)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & ./build/test_chops_artefacts/Release/test_chops.exe
          if ($LASTEXITCODE -ne 0) { throw 'Per-chop placement failed' }
          & ./build/test_depth_artefacts/Release/test_depth.exe
          if ($LASTEXITCODE -ne 0) { throw 'Depth failed' }

      - name: The MAP played (a row is a degree, a mark fires a chop)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & ./build/test_map_artefacts/Release/test_map.exe
          if ($LASTEXITCODE -ne 0) { throw 'Map playback failed' }

      - name: Patches Batchcut wrote, opened and played here
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & ./build/test_endtoend_artefacts/Release/test_endtoend.exe tests/patches
          if ($LASTEXITCODE -ne 0) { throw 'End-to-end test failed' }

      - name: The Orb, the room and the randomiser
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & ./build/Release/test_orb.exe
          if ($LASTEXITCODE -ne 0) { throw 'Orb test failed' }
          & ./build/Release/test_room.exe
          if ($LASTEXITCODE -ne 0) { throw 'Room test failed' }
          & ./build/Release/test_random.exe
          if ($LASTEXITCODE -ne 0) { throw 'Randomiser test failed' }

      - name: Sequencer tests (the same line on every platform, the rows, TRAFFIC, DIALECT, gates and ties)
        if: ${{ !cancelled() }}
        run: build\Release\test_jaq.exe

      - name: Clock tests (the notes sent, the three clock modes, Follow and Bass, block sizes)
        if: ${{ !cancelled() }}
        run: build\Release\test_clock.exe

      - name: MidiJaQ session, chord, generators and instrument tests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & ./build/Release/test_session.exe
          if ($LASTEXITCODE -ne 0) { throw 'Session test failed' }
          & ./build/Release/test_evolving.exe
          if ($LASTEXITCODE -ne 0) { throw 'Evolving-generator test failed' }
          $inst = Get-ChildItem build -Recurse -Filter test_inst.exe | Select-Object -First 1
          if (-not $inst) { throw 'Instrument test is missing' }
          & $inst.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Instrument test failed' }

      - name: Validate the VST3 with pluginval (strictness 10, 3 random seeds)
        if: ${{ !cancelled() }}
        continue-on-error: false
        timeout-minutes: 30
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval.exe is a GUI-subsystem program: PowerShell only waits for it (and gets its exit code)
          # when its output is piped. Unpiped, the step ends at once and the runner kills pluginval mid-test.
          $vst = "build\MidiJaQ_artefacts\Release\VST3\MidiJaQ.vst3"
          $failed = 0
          for ($i = 0; $i -le 2; $i++) {
            $seed = "0x{0:x}" -f (Get-Random -Minimum 1 -Maximum 0x7fffffff)
            $log = "pv_$i.txt"
            .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --random-seed $seed --timeout-ms 600000 --output-dir pluginval-log $vst | Out-File $log
            # ${seed} in braces: "$seed:" would be read as a scoped variable name and stop the script
            if ($LASTEXITCODE -eq 0) { Write-Host "seed ${seed}: SUCCESS" }
            else { $failed++; Write-Host "==== seed ${seed} FAILED (exit code $LASTEXITCODE)"; Get-Content $log -Tail 80 }
          }
          Write-Host "$failed of 3 pluginval runs failed"
          if ($failed -gt 0) { exit 1 }

      # packaged even when a test step failed (the run still shows the failure), so a timing hiccup on the
      # runner does not hold back the build
      - name: Package
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\MidiJaQ_artefacts\Release\VST3\MidiJaQ.vst3" dist\
          Copy-Item "build\MidiJaQ_artefacts\Release\Standalone\MidiJaQ.exe" dist\
          Copy-Item README.md dist\
          if (Test-Path pluginval-log) { Copy-Item -Recurse pluginval-log dist\ }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: MidiJaQ-Windows
          path: dist

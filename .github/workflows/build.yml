name: Build NeoBeat (Windows)

on:
  push:
    branches: [ main, neobeat-2.0 ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build plugin, standalone and tools
        run: cmake --build build --config Release --parallel --target NeoBeat_VST3 NeoBeat_Standalone neobeat_cli test_sequencer test_workstation

      - name: Sequencer timing test
        run: build\Release\test_sequencer.exe

      - name: Workstation tests (Matrixxxer, grid, key map, modulation, threads)
        run: build\Release\test_workstation.exe

      - name: Render a preset with the Windows build (sanity check)
        run: build\Release\neobeat_cli.exe preset 0 build\swingbeat_classic_check.wav 2

      - name: Validate the VST3 with pluginval
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval runs the plugin in a child process: if it crashes, pluginval prints the call stack
          .\pluginval\pluginval.exe --strictness-level 10 --timeout-ms 600000 --output-dir pluginval-log build\NeoBeat_artefacts\Release\VST3\NeoBeat.vst3
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path pluginval-log)) { Get-ChildItem pluginval-log -Recurse -File | ForEach-Object { Write-Host "==== $($_.Name)"; Get-Content $_.FullName -Tail 150 } }
          exit $code

      - name: pluginval 15 more times (10 in a child process, 5 in-process)
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          $vst = "build\NeoBeat_artefacts\Release\VST3\NeoBeat.vst3"
          $failed = 0
          for ($i = 1; $i -le 15; $i++) {
            $seed = "0x{0:x}" -f (Get-Random -Minimum 1 -Maximum 0x7fffffff)
            $mode = if ($i -le 10) { @() } else { @("--validate-in-process") }
            $label = if ($i -le 10) { "child process" } else { "in-process" }
            & .\pluginval\pluginval.exe --strictness-level 10 --random-seed $seed --timeout-ms 600000 @mode $vst *> "pv_$i.txt"
            $code = $LASTEXITCODE
            if ($code -eq 0) { Write-Host "run $i ($label, seed $seed): SUCCESS" }
            else { $failed++; Write-Host "==== run $i ($label, seed $seed) FAILED with exit code $code"; Get-Content "pv_$i.txt" -Tail 150 }
          }
          Write-Host "$failed of 15 runs failed"
          if ($failed -gt 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\NeoBeat_artefacts\Release\VST3\NeoBeat.vst3" dist\
          Copy-Item "build\NeoBeat_artefacts\Release\Standalone\NeoBeat.exe" dist\
          Copy-Item README.md dist\
          if (Test-Path pluginval-log) { Copy-Item -Recurse pluginval-log dist\ }

      - uses: actions/upload-artifact@v4
        with:
          name: NeoBeat-Windows
          path: dist

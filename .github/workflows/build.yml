name: Build NeoBeat (Windows)

on:
  push:
    branches: [ main, neobeat-2.0 ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build plugin, standalone and tools
        run: cmake --build build --config Release --parallel --target NeoBeat_VST3 NeoBeat_Standalone neobeat_cli test_sequencer test_workstation

      - name: Sequencer timing test
        run: build\Release\test_sequencer.exe

      - name: Workstation tests (Matrixxxer, grid, key map, modulation, threads)
        run: build\Release\test_workstation.exe

      - name: Render a preset with the Windows build (sanity check)
        run: build\Release\neobeat_cli.exe preset 0 build\swingbeat_classic_check.wav 2

      - name: Validate the VST3 with pluginval (strictness 10, then 5 more random seeds)
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $vst = "build\NeoBeat_artefacts\Release\VST3\NeoBeat.vst3"
          # pluginval.exe is a GUI-subsystem program: PowerShell only waits for it (and gets its exit code)
          # when its output is piped. Unpiped, the step ends at once and the runner kills pluginval mid-test.
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 600000 --output-dir pluginval-log $vst | Tee-Object -FilePath pv_main.txt
          $failed = 0
          if ($LASTEXITCODE -ne 0) { $failed++; Write-Host "==== main run FAILED (exit code $LASTEXITCODE)" } else { Write-Host "==== main run: SUCCESS" }
          for ($i = 1; $i -le 5; $i++) {
            $seed = "0x{0:x}" -f (Get-Random -Minimum 1 -Maximum 0x7fffffff)
            .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --random-seed $seed --timeout-ms 600000 $vst | Out-File "pv_$i.txt"
            if ($LASTEXITCODE -eq 0) { Write-Host "run $i (seed $seed): SUCCESS" }
            else { $failed++; Write-Host "==== run $i (seed $seed) FAILED (exit code $LASTEXITCODE)"; Get-Content "pv_$i.txt" -Tail 80 }
          }
          Write-Host "$failed of 6 pluginval runs failed"
          if ($failed -gt 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\NeoBeat_artefacts\Release\VST3\NeoBeat.vst3" dist\
          Copy-Item "build\NeoBeat_artefacts\Release\Standalone\NeoBeat.exe" dist\
          Copy-Item README.md dist\
          if (Test-Path pluginval-log) { Copy-Item -Recurse pluginval-log dist\ }

      - uses: actions/upload-artifact@v4
        with:
          name: NeoBeat-Windows
          path: dist
